[keybinds]
"Ctrl+Mod+R" = "config-reload"
"Mod+Shift+c" = "cheatsheet-toggle"
"Mod+Shift+Return" = "workspace-set-layout:toggle"

"Mod+W" = "spawn:helium-browser"
"Mod+D" = "spawn:discord"
"Mod+T" = "spawn:Telegram"
"Mod+E" = "spawn:dolphin"
"Mod+Period" = "spawn:systemsettings"

"Mod+Q" = "window-close"
"Mod+O" = "overview-toggle"
"Mod+V" = "window-toggle-floating"
"Mod+R" = "window-cycle-primary-extent"
"Mod+F" = "window-toggle-maximize"
"Shift+Mod+F" = "window-toggle-maximize-to-edges"

"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"

"Mod+I" = "workspace-previous"
"Mod+U" = "workspace-next"

"Mod+Left" = "window-focus-left"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+Right" = "window-focus-right"

"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Shift+Mod+WheelUp" = "workspace-previous"
"Shift+Mod+WheelDown" = "workspace-next"
"Ctrl+Mod+WheelUp" = "window-move-to-workspace-previous"
"Ctrl+Mod+WheelDown" = "window-move-to-workspace-next"
"Ctrl+Mod+I" = "window-move-to-workspace-previous"
"Ctrl+Mod+U" = "window-move-to-workspace-next"

"Shift+Ctrl+Mod+1" = "window-move-to-workspace:1"
"Shift+Ctrl+Mod+2" = "window-move-to-workspace:2"
"Shift+Ctrl+Mod+3" = "window-move-to-workspace:3"
"Shift+Ctrl+Mod+4" = "window-move-to-workspace:4"
"Shift+Ctrl+Mod+5" = "window-move-to-workspace:5"
"Shift+Ctrl+Mod+6" = "window-move-to-workspace:6"
"Shift+Ctrl+Mod+7" = "window-move-to-workspace:7"
"Shift+Ctrl+Mod+8" = "window-move-to-workspace:8"
"Shift+Ctrl+Mod+9" = "window-move-to-workspace:9"

"Mod+C" = "column-center"
"Ctrl+Mod+Left" = "column-move-left"
"Ctrl+Mod+Right" = "column-move-right"
"Ctrl+Mod+Up" = "window-move-up"
"Ctrl+Mod+Down" = "window-move-down"

"Mod+BracketLeft" = "window-consume-left"

"Ctrl+Shift+Mod+Left" = "column-move-to-output-left"
"Ctrl+Shift+Mod+Right" = "column-move-to-output-right"
"Ctrl+Shift+Mod+Up" = "column-move-to-output-up"
"Ctrl+Shift+Mod+Down" = "column-move-to-output-down"

"Shift+Mod+Left" = "output-focus-left"
"Shift+Mod+Right" = "output-focus-right"
"Shift+Mod+Up" = "output-focus-up"
"Shift+Mod+Down" = "output-focus-down"

"Mod+Space" = "spawn:noctalia msg panel-toggle launcher"
"Mod+S" = "spawn:noctalia msg panel-toggle control-center"
"Mod+A" = "spawn:noctalia msg panel-toggle control-center notifications"
"Mod+M" = "spawn:noctalia msg panel-toggle control-center media"
"Mod+Z" = "spawn:noctalia msg panel-toggle launcher /emo"
"Mod+Shift+V" = "spawn:noctalia msg panel-toggle clipboard"
"Shift+Mod+S" = "spawn:noctalia msg screenshot-region"
"Mod+P" = "spawn:noctalia msg panel-toggle noctalia/umbriel-companion:panel"
"Mod+Shift+P" = "spawn:noctalia msg screenshot-fullscreen"
"Mod+Shift+W" = "spawn:noctalia msg desktop-widgets-toggle-edit"
"Mod+X" = "spawn:noctalia msg panel-toggle session"
"Mod+Comma" = "spawn:noctalia msg settings-toggle"
"Alt+Tab" = "spawn:noctalia msg window-switcher"

# Volume (via Noctalia OSD)
"XF86AudioRaiseVolume" = "spawn:noctalia msg volume-up 2%"
"XF86AudioLowerVolume" = "spawn:noctalia msg volume-down 2%"
"XF86AudioMute" = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"

# Brightness
"XF86MonBrightnessUp" = "spawn:noctalia msg brightness-up"
"XF86MonBrightnessDown" = "spawn:noctalia msg brightness-down"
