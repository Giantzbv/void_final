[hooks]
battery_charging = """powerprofilesctl set performance &&  echo ' [animation]
    enabled = true

    [appearance.blur]
    passes = 4

    [appearance.shadow]
    enabled = true

    [[window_rule]]
    match.app_id = \"^(kitty|code|foot)$\"
    blur_optimized = false

    [keybinds]
    \"Mod+Return\" = \"spawn:kitty\" '  > ~/.config/umbriel/toggle/battery_toggle.toml"""
battery_discharging = """powerprofilesctl set power-saver && echo ' [animation]
    enabled = false

    [appearance.blur]
    passes = 1

    [[window_rule]]
    match.app_id = \"^(kitty|code|foot)$\"
    blur_optimized = true

    [appearance.shadow]
    enabled = false

    [keybinds]
    \"Mod+Return\" = \"spawn:foot\" '  > ~/.config/umbriel/toggle/battery_toggle.toml"""

